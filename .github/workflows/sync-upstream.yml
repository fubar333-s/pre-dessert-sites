# 每天把上游 mantou568/pre-dessert-sites 的 main 合并进本 fork 的 main。
# 本 fork 自己的修改保留；与上游冲突时本次运行失败（GitHub 会发邮件通知），需要人工解决，不会强推覆盖。
# 时间：UTC 23:30 = 北京时间 07:30，早于 Media Saber 每天 09:19 的站点配置更新。
name: Sync Upstream

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'fubar333-s/pre-dessert-sites'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/mantou568/pre-dessert-sites.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "已包含上游最新提交，无需同步。"
            exit 0
          fi
          if ! git merge --no-edit upstream/main -m "merge: 同步上游 mantou568/pre-dessert-sites main"; then
            echo "::error::与上游冲突，需要人工合并："
            git diff --name-only --diff-filter=U
            exit 1
          fi
          # 校验本次合并带进来的 JSON，坏文件不推送
          git diff --name-only --diff-filter=AM ORIG_HEAD HEAD -- site_config/ | { grep '\.json$' || true; } | while read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f"
          done
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 的推送不会触发其他工作流，这里显式触发 release.yml，
      # 生成新的 main_* Release，Media Saber 才能拉到同步后的配置。
      - name: Trigger release
        if: steps.merge.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
